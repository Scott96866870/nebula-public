[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula-public"
version = "0.4.0"
description = "Local tools for cataloging, validating, verifying, and comparing Nebula public releases."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nebula contributors" }]
dependencies = []

[project.scripts]
nebula-public = "nebula_public.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nebula_public*"]
